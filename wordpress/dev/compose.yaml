name: rosa-medical-foundation

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${ROSA_WP_DB_NAME:-rosa_gate0}
      MARIADB_USER: ${ROSA_WP_DB_USER:-rosa}
      MARIADB_PASSWORD: ${ROSA_WP_DB_PASSWORD:-rosa-local-only}
      MARIADB_ROOT_PASSWORD: ${ROSA_WP_DB_ROOT_PASSWORD:-rosa-root-local-only}
    volumes:
      - rosa_foundation_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ROSA_WP_PORT:-8088}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${ROSA_WP_DB_NAME:-rosa_gate0}
      WORDPRESS_DB_USER: ${ROSA_WP_DB_USER:-rosa}
      WORDPRESS_DB_PASSWORD: ${ROSA_WP_DB_PASSWORD:-rosa-local-only}
      WORDPRESS_DEBUG: ${ROSA_WP_DEBUG:-1}
    volumes:
      - rosa_foundation_wordpress:/var/www/html
      - ../wp-content/plugins/rosa-medical-core:/var/www/html/wp-content/plugins/rosa-medical-core
      - ../wp-content/themes/rosa-medical-child:/var/www/html/wp-content/themes/rosa-medical-child

  wpcli:
    image: wordpress:cli
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${ROSA_WP_DB_NAME:-rosa_gate0}
      WORDPRESS_DB_USER: ${ROSA_WP_DB_USER:-rosa}
      WORDPRESS_DB_PASSWORD: ${ROSA_WP_DB_PASSWORD:-rosa-local-only}
    volumes:
      - rosa_foundation_wordpress:/var/www/html
      - ../wp-content/plugins/rosa-medical-core:/var/www/html/wp-content/plugins/rosa-medical-core
      - ../wp-content/themes/rosa-medical-child:/var/www/html/wp-content/themes/rosa-medical-child
    entrypoint: ["wp"]

volumes:
  rosa_foundation_db:
    name: rosa_medical_foundation_db
  rosa_foundation_wordpress:
    name: rosa_medical_foundation_wordpress
