name: Temporary Main Frontend Sync Verification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-main-frontend-sync-verification
  cancel-in-progress: true

env:
  CI: "true"
  PNPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS: "true"
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'http://127.0.0.1:54321' }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'temporary-verification-anon-key' }}

jobs:
  synchronized-core:
    name: Synchronized branch frozen core checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout synchronized branch
        uses: actions/checkout@v4
        with:
          ref: integration/main-frontend-f3ed-sync
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm 11.4.0
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          node --version
          pnpm --version

      - name: Install exact workspace lockfile
        run: pnpm install --frozen-lockfile

      - name: Generate contracts and check drift
        run: |
          pnpm contracts:generate
          git diff --exit-code -- packages/contracts/src/generated/schema.ts

      - name: Lint
        run: pnpm lint

      - name: Strict typecheck
        run: pnpm typecheck

      - name: Unit, contract and static tests
        run: pnpm test

      - name: Production build
        run: pnpm build

  public-browser:
    name: Synchronized public browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: synchronized-core
    steps:
      - name: Checkout synchronized branch
        uses: actions/checkout@v4
        with:
          ref: integration/main-frontend-f3ed-sync
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm 11.4.0
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate

      - name: Install exact workspace lockfile
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @rosa/web exec playwright install --with-deps chromium

      - name: Run public desktop, tablet and mobile matrix
        run: >-
          pnpm --filter @rosa/web exec playwright test
          tests/e2e/f3a-public-pages.spec.ts
          tests/e2e/f3b-catalogue-pages.spec.ts
          tests/e2e/f3c-procurement-pages.spec.ts
          tests/e2e/f3d-public-support-pages.spec.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: synchronized-public-playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 3
