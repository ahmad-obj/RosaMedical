name: Temporary Cinematic Tree Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tree-sha:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Print branch tree
        run: git rev-parse HEAD^{tree}
