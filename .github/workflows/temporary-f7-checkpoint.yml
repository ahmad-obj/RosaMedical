name: Temporary Cinematic Media Review

on:
  pull_request:
    branches: [main]

concurrency:
  group: temporary-cinematic-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Validate committed review assets
        shell: bash
        run: |
          expected=(
            apps/web/public/media/cinematic/homepage-hero.webp
            apps/web/public/media/cinematic/homepage-procurement.webp
            apps/web/public/media/cinematic/about-hero.webp
            apps/web/public/media/cinematic/about-procurement.webp
            apps/web/public/media/catalogue-covers/knives.webp
            apps/web/public/media/catalogue-covers/scissors.webp
            apps/web/public/media/catalogue-covers/punches.webp
            apps/web/public/media/catalogue-covers/chisels.webp
            apps/web/public/media/catalogue-covers/cutters.webp
          )
          for file in "${expected[@]}"; do
            test -s "$file" || { echo "Missing committed asset: $file"; exit 1; }
            file "$file"
          done
      - name: Upload corrected review assets
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-media-review-v2
          path: |
            apps/web/public/media/cinematic/*.webp
            apps/web/public/media/catalogue-covers/*.webp
          if-no-files-found: error
          retention-days: 7
