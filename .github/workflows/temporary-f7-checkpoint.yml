name: Temporary Cinematic Media Verification

on:
  pull_request:
    branches: [main]

concurrency:
  group: temporary-cinematic-verification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
  ROSA_OWNER_EMAIL: owner@example.com
  ALERT_UNREAD_SECRET: placeholder-alert-secret
  RESEND_API_KEY: placeholder-resend-key

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=append-only
      - name: Check premium stylesheet contract
        run: node --test apps/web/src/test/f7-premium-styles.static.test.mjs
      - name: Lint web application
        run: pnpm --filter @rosa/web lint
      - name: Test web application
        run: pnpm --filter @rosa/web test
      - name: Typecheck web application
        run: pnpm --filter @rosa/web typecheck
      - name: Build web application
        run: pnpm --filter @rosa/web build
      - name: Install Playwright Chromium
        run: pnpm --filter @rosa/web exec playwright install --with-deps chromium
      - name: Test affected public journeys
        run: >-
          pnpm --filter @rosa/web exec playwright test
          tests/e2e/f7-public-shell.spec.ts
          tests/e2e/f7-homepage-polish.spec.ts
          tests/e2e/f7-product-polish.spec.ts
          tests/e2e/f7-story-pages.spec.ts
          tests/e2e/f7-conversion-polish.spec.ts
          tests/e2e/f7-reduced-motion.spec.ts
          tests/e2e/f7-responsive-restraint.spec.ts
